# cargo-features = ["profile-rustflags"] # requires nightly

[package]
name = "pcfg"
version = "0.1.0"
edition = "2024"

[dependencies]
logos = "0.16.1"
hashbrown = { version = "0.17.1", features = ["serde"] }
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0" }

# See https://github.com/johnthagen/min-sized-rust
[profile.release]
opt-level=3
codegen-units = 1
panic = "abort"
strip = true
lto = true
# rustflags = ["-Zlocation-detail=none", "-Zfmt-debug=none"]

[features]
# Enables Clone on Grammar (and anything else gated) for tests/benches only.
testing = []

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
# Self-dependency trick: enables `testing` automatically during test/bench/example
# builds via feature unification, without affecting `cargo build`/release.
pcfg = { path = ".", features = ["testing"] }

[[bench]]
name = "guessing"
harness = false
