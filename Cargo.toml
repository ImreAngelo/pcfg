[package]
name = "pcfg"
version = "0.1.0"
edition = "2024"

[dependencies]
logos = "0.16.1"
hashbrown = { version = "0.17.1", features = ["serde"] }
postcard = { version = "1.1.3", features = ["use-std"] }

serde = { version = "1.0" } # { version = "1.0", default-features = false } 

# TODO: Add nightly flags; see https://github.com/johnthagen/min-sized-rust
[profile.release]
opt-level=3
codegen-units = 1
panic = "abort"
strip = true
lto = true