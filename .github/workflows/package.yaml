name: Package and release

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch: # for testing

concurrency: release

jobs:
  version: # Pull semver from Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Is this version released yet?
        run: |
          tag="v$(cargo pkgid | sed 's/.*[#@]//')"
          if gh release view "$tag" > /dev/null 2>&1; then new=false; else new=true; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2 # cargo-deb is pre-compiled
        with:
          tool: cargo-deb
      - run: cargo deb
      - run: gh release create "$TAG" target/debian/*.deb --target "$GITHUB_SHA" --generate-notes

  crate:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  pages:
    needs: release
    if: ${{ !cancelled() && !failure() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7 # to checkout setup.sh

      - name: Install apt-ftparchive
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils

      - name: Build signed apt repo
        run: |
          mkdir -p site/pool && cd site

          # Last 10 .deb releases
          for tag in $(gh release list -R "$GITHUB_REPOSITORY" --limit 10 --json tagName,isPrerelease \
            -q '.[] | select(.tagName | startswith("v")) | select(.isPrerelease | not) | .tagName'); do
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -p '*.deb' -D pool
          done

          # Index
          mkdir -p dists/stable/main/binary-amd64
          apt-ftparchive packages pool > dists/stable/main/binary-amd64/Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Components=main \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            release dists/stable > Release
          mv Release dists/stable/

          # Sign, publish the public key and the setup script
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --armor --export > key.asc
          cp ../scripts/setup.sh .

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5